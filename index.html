<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国朝代史 · 纵览</title>
<style>
  :root{
    --paper:#f3ebe0; --ink:#211b17; --ink2:#5c4d42; --line:#d9cab5; --gold:#b98a35;
    --c1:#8c6b4f; --c2:#a8752f; --c3:#6d7f5b; --c4:#8a5a4a; --c5:#5c7285; --c6:#6f5a78;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:
      radial-gradient(circle at 15% -5%, #fcf7ef 0%, transparent 50%),
      radial-gradient(circle at 95% 105%, #eee0cc 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",SimSun,"STSong",serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:28px 22px 70px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .seal{width:46px;height:46px;border-radius:8px;background:#b23a2e;color:#fff;
    display:grid;place-items:center;font-size:20px;letter-spacing:2px;box-shadow:0 3px 0 #8d2b21;flex:0 0 auto}
  h1{font-size:27px;margin:0;letter-spacing:3px;font-weight:600}
  .sub{font-size:13px;color:var(--ink2);letter-spacing:1px;margin-top:4px}
  .lede{margin:18px 0 14px;font-size:14px;color:var(--ink2);line-height:1.8;max-width:60ch}
  .lede b{color:var(--ink)}
  .ribbon{display:flex;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
  .seg{position:relative;display:block;height:100%;text-decoration:none;transition:filter .15s}
  .seg:hover{filter:brightness(1.12)}
  .seg span{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:10px;
    color:rgba(255,255,255,.94);letter-spacing:1px;white-space:nowrap;overflow:hidden}
  .axis{position:relative;height:16px;margin-top:6px;font-size:10.5px;color:#a58e71;letter-spacing:.5px}
  .axis span{position:absolute;transform:translateX(-50%)}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0 30px;font-size:12px;color:var(--ink2)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
  .era{margin-bottom:26px}
  .era h2{font-size:12px;letter-spacing:4px;color:var(--gold);font-weight:600;
    margin:0 0 8px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
  .row{display:grid;grid-template-columns:168px 112px 1fr auto;align-items:baseline;gap:12px;
    padding:11px 10px;text-decoration:none;color:inherit;border-radius:10px;
    border:1px solid transparent;transition:.13s}
  .row:hover{background:#fff;border-color:var(--gold);transform:translateX(2px)}
  .row .yr{font-size:11.5px;color:#a9834a;font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .row .nm{font-size:19px;letter-spacing:2px;white-space:nowrap}
  .row .hk{font-size:13px;color:var(--ink2);line-height:1.5}
  .row .go{font-size:12px;color:#b3a08a;letter-spacing:1px}
  .row:hover .go{color:#b23a2e}
  .row .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:2px}
  footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:#a58e71;line-height:1.8}
  footer code{font-size:11.5px}
  @media (max-width:640px){
    .row{grid-template-columns:1fr auto;gap:4px 10px}
    .row .yr{grid-column:1 / -1;font-size:11px}
    .row .hk{grid-column:1 / -1}
    .ribbon{height:36px}
    h1{font-size:22px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seal">史</div>
    <div>
      <h1>中国朝代史</h1>
      <div class="sub">十八个时期 · 约四千年 · 点任意一段进入</div>
    </div>
  </header>

  <p class="lede">从夏到清，中国历史的主线换了十八次主角。<b>色块的长度就是它在位的年数</b>——秦只有十五年，周却有八百年。点色块或下面的条目，进入该时期的皇位更替、主线章节与闯关。</p>

  <div class="ribbon" id="ribbon"></div>
  <div class="axis" id="axis"></div>
  <div class="legend" id="legend"></div>
  <div id="list"></div>

  <footer>
    数据与各朝代页面在 <code>tang-map/</code>；年代依《夏商周断代工程》与通行年表，标「约」者为推定值。<br>
    文物图片来自 Wikimedia Commons，许可见各图片源页。
  </footer>
</div>

<script>
var DATA = {"rows":[{"id":"xia","name":"夏","years":"约前2070—前1600","s":-2070,"e":-1600,"era":0,"hook":"治水换来的王权"},{"id":"shang","name":"商","years":"约前1600—前1046","s":-1600,"e":-1046,"era":0,"hook":"甲骨与青铜的王朝"},{"id":"zhou","name":"西周","years":"前1046—前771","s":-1046,"e":-771,"era":0,"hook":"分封、宗法与礼乐"},{"id":"chunqiu","name":"春秋","years":"前770—前476","s":-770,"e":-476,"era":0,"hook":"霸主代替天子"},{"id":"zhanguo","name":"战国","years":"前475—前221","s":-475,"e":-221,"era":0,"hook":"变法竞赛，秦笑到最后"},{"id":"qin","name":"秦","years":"前221—前206","s":-221,"e":-206,"era":1,"hook":"十五年改造天下"},{"id":"han","name":"汉","years":"前202—220","s":-202,"e":220,"era":1,"hook":"郡县与儒术的定型"},{"id":"sanguo","name":"三国","years":"220—280","s":220,"e":280,"era":2,"hook":"三方立国，谁都没赢"},{"id":"jin","name":"晋","years":"265—420","s":265,"e":420,"era":2,"hook":"门阀与皇权共治"},{"id":"sui","name":"隋","years":"581—618","s":581,"e":618,"era":3,"hook":"制度比武功更长久"},{"id":"tang","name":"唐","years":"618—907","s":617,"e":907,"era":3,"hook":"从贞观到藩镇"},{"id":"wudai","name":"五代十国","years":"907—960","s":907,"e":979,"era":4,"hook":"武人当国，南方积累"},{"id":"song","name":"宋","years":"960—1279","s":960,"e":1279,"era":4,"hook":"用制度换和平"},{"id":"liao","name":"辽","years":"916—1125","s":916,"e":1125,"era":4,"hook":"草原与农耕的二元帝国"},{"id":"jin2","name":"金","years":"1115—1234","s":1114,"e":1234,"era":4,"hook":"从部落到中原王朝"},{"id":"yuan","name":"元","years":"1271—1368","s":1271,"e":1368,"era":5,"hook":"行省、纸币与双轨治理"},{"id":"ming","name":"明","years":"1368—1644","s":1368,"e":1644,"era":5,"hook":"废相之后的皇权"},{"id":"qing","name":"清","years":"1636—1912","s":1636,"e":1912,"era":5,"hook":"最后一个王朝的收尾"}],"eras":["先秦","秦汉","魏晋南北朝","隋唐","五代 · 宋辽金","元明清"]};

(function () {
  var rows = DATA.rows, eras = DATA.eras;
  var VAR = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"];
  var min = Math.min.apply(null, rows.map(function (r) { return r.s; }));
  var max = Math.max.apply(null, rows.map(function (r) { return r.e; }));
  var total = max - min;
  var base = "tang-map/index.html#d=";

  document.getElementById("ribbon").innerHTML = rows.map(function (r) {
    var w = Math.max((r.e - r.s) / total * 100, 1.2);
    return '<a class="seg" href="' + base + r.id + '" title="' + r.name + " " + r.years + '"' +
      ' style="width:' + w.toFixed(3) + "%;background:var(" + VAR[r.era] + ')">' +
      (w >= 4 ? "<span>" + r.name + "</span>" : "") + "</a>";
  }).join("");

  var TICKS = [[-2070, "约前 2070"], [-1000, "前 1000"], [0, "元年"], [1000, "1000"], [1912, "1912"]];
  document.getElementById("axis").innerHTML = TICKS.map(function (t) {
    return '<span style="left:' + ((t[0] - min) / total * 100).toFixed(2) + '%">' + t[1] + "</span>";
  }).join("");

  document.getElementById("legend").innerHTML = eras.map(function (name, i) {
    return '<span><i style="background:var(' + VAR[i] + ')"></i>' + name + "</span>";
  }).join("");

  document.getElementById("list").innerHTML = eras.map(function (name, i) {
    var items = rows.filter(function (r) { return r.era === i; });
    if (!items.length) return "";
    return '<section class="era"><h2>' + name + "</h2>" + items.map(function (r) {
      return '<a class="row" href="' + base + r.id + '">' +
        '<span class="yr">' + r.years + "</span>" +
        '<span class="nm"><span class="dot" style="background:var(' + VAR[i] + ')"></span>' + r.name + "</span>" +
        '<span class="hk">' + r.hook + "</span>" +
        '<span class="go">进入 →</span></a>';
    }).join("") + "</section>";
  }).join("");
})();
</script>
</body>
</html>
