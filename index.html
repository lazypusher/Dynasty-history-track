<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国朝代史 · 纵览</title>
<style>
  :root{
    --paper:#f3ebe0; --paper2:#faf5ec; --ink:#211b17; --ink2:#5c4d42;
    --red:#b23a2e; --gold:#b98a35; --line:#d9cab5;
    --c1:#8c6b4f; --c2:#a8752f; --c3:#6d7f5b; --c4:#8a5a4a; --c5:#5c7285; --c6:#6f5a78;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:
      radial-gradient(circle at 15% -5%, #fcf7ef 0%, transparent 50%),
      radial-gradient(circle at 95% 105%, #eee0cc 0%, transparent 45%),
      var(--paper);
    color:var(--ink);
    font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",SimSun,"STSong",serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:28px 22px 70px}

  header{display:flex;align-items:center;gap:14px;margin-bottom:10px}
  .seal{width:46px;height:46px;border-radius:8px;background:var(--red);color:#fff;
    display:grid;place-items:center;font-size:20px;letter-spacing:2px;box-shadow:0 3px 0 #8d2b21;flex:0 0 auto}
  h1{font-size:27px;margin:0;letter-spacing:3px;font-weight:600}
  .sub{font-size:13px;color:var(--ink2);letter-spacing:1px;margin-top:4px}
  .lede{margin:18px 0 14px;font-size:14px;color:var(--ink2);line-height:1.8;max-width:60ch}
  .lede b{color:var(--ink)}

  /* ---------- 长卷 ---------- */
  .ribbon{display:flex;height:44px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fff}
  .seg{position:relative;display:block;height:100%;text-decoration:none;transition:filter .15s}
  .seg:hover{filter:brightness(1.12)}
  .seg span{
    position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:10px;color:rgba(255,255,255,.92);
    letter-spacing:1px;white-space:nowrap;overflow:hidden;
  }
  .axis{position:relative;height:16px;margin-top:6px;font-size:10.5px;color:#a58e71;letter-spacing:.5px}
  .axis span{position:absolute;transform:translateX(-50%)}

  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:14px 0 30px;font-size:12px;color:var(--ink2)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}

  /* ---------- 列表 ---------- */
  .era{margin-bottom:26px}
  .era h2{
    font-size:12px;letter-spacing:4px;color:var(--gold);font-weight:600;
    margin:0 0 8px;padding-bottom:6px;border-bottom:1px dashed var(--line);
  }
  .row{
    display:grid;grid-template-columns:168px 112px 1fr auto;align-items:baseline;gap:12px;
    padding:11px 10px;text-decoration:none;color:inherit;border-radius:10px;
    border:1px solid transparent;transition:.13s;
  }
  .row:hover{background:#fff;border-color:var(--gold);transform:translateX(2px)}
  .row .yr{font-size:11.5px;color:#a9834a;font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .row .nm{font-size:19px;letter-spacing:2px;white-space:nowrap}
  .row .hk{font-size:13px;color:var(--ink2);line-height:1.5}
  .row .go{font-size:12px;color:#b3a08a;letter-spacing:1px}
  .row:hover .go{color:var(--red)}
  .row .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:2px}

  footer{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:#a58e71;line-height:1.8}
  @media (max-width:640px){
    .row{grid-template-columns:1fr auto;gap:4px 10px}
    .row .yr{grid-column:1 / -1;font-size:11px}
    .row .hk{grid-column:1 / -1}
    .ribbon{height:36px}
    h1{font-size:22px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seal">史</div>
    <div>
      <h1>中国朝代史</h1>
      <div class="sub">十八个时期 · 约四千年 · 点任意一段进入</div>
    </div>
  </header>

  <p class="lede">从夏到清，中国历史的主线换了十八次主角。<b>色块的长度就是它在位的年数</b>——秦只有十五年，周却有八百年。点色块或下面的条目，进入该时期的皇位更替、主线章节与闯关。</p>

  <div class="ribbon" id="ribbon"></div>
  <div class="axis" id="axis"></div>

  <div class="legend" id="legend"></div>
  <div id="list"></div>

  <footer>
    数据与各朝代页面在 <code>tang-map/</code>；年代依《夏商周断代工程》与通行年表，公元前的年份标「约」者表示推定值。<br>
    文物图片来自 Wikimedia Commons，许可见各图片源页。
  </footer>
</div>

<script src="tang-map/data/dynasties.js"></script>
<script src="tang-map/data/xia.js"></script>
<script src="tang-map/data/shang.js"></script>
<script src="tang-map/data/zhou.js"></script>
<script src="tang-map/data/chunqiu.js"></script>
<script src="tang-map/data/zhanguo.js"></script>
<script src="tang-map/data/qin.js"></script>
<script src="tang-map/data/han.js"></script>
<script src="tang-map/data/sanguo.js"></script>
<script src="tang-map/data/jin.js"></script>
<script src="tang-map/data/sui.js"></script>
<script src="tang-map/data/song.js"></script>
<script src="tang-map/data/wudai.js"></script>
<script src="tang-map/data/liao.js"></script>
<script src="tang-map/data/jin2.js"></script>
<script src="tang-map/data/yuan.js"></script>
<script src="tang-map/data/ming.js"></script>
<script src="tang-map/data/qing.js"></script>

<script>
(function () {
  const D = window.DYNASTIES || {};
  const L = window.DYNASTY_LIST || [];

  const ERAS = [
    { name: "先秦", cls: "--c1", ids: ["xia", "shang", "zhou", "chunqiu", "zhanguo"] },
    { name: "秦汉", cls: "--c2", ids: ["qin", "han"] },
    { name: "魏晋南北朝", cls: "--c3", ids: ["sanguo", "jin"] },
    { name: "隋唐", cls: "--c4", ids: ["sui", "tang"] },
    { name: "五代 · 宋辽金", cls: "--c5", ids: ["wudai", "song", "liao", "jin2"] },
    { name: "元明清", cls: "--c6", ids: ["yuan", "ming", "qing"] }
  ];
  const HOOK = {
    xia: "治水换来的王权", shang: "甲骨与青铜的王朝", zhou: "分封、宗法与礼乐",
    chunqiu: "霸主代替天子", zhanguo: "变法竞赛，秦笑到最后", qin: "十五年改造天下",
    han: "郡县与儒术的定型", sanguo: "三方立国，谁都没赢", jin: "门阀与皇权共治",
    sui: "制度比武功更长久", tang: "从贞观到藩镇", wudai: "武人当国，南方积累",
    song: "用制度换和平", liao: "草原与农耕的二元帝国", jin2: "从部落到中原王朝",
    yuan: "行省、纸币与双轨治理", ming: "废相之后的皇权", qing: "最后一个王朝的收尾"
  };
  const eraOf = id => {
    for (let i = 0; i < ERAS.length; i++) if (ERAS[i].ids.includes(id)) return i;
    return 0;
  };

  const rows = L.filter(x => D[x.id]).map(x => {
    const d = D[x.id];
    const s = d.chapters[0].s, e = d.chapters[d.chapters.length - 1].e;
    return { id: x.id, name: x.name, years: x.years, s, e, span: e - s, era: eraOf(x.id), hook: HOOK[x.id] || "" };
  });

  const min = Math.min(...rows.map(r => r.s));
  const max = Math.max(...rows.map(r => r.e));
  const total = max - min;

  const VAR = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"];

  const TICKS = [[-2070, "约前 2070"], [-1000, "前 1000"], [0, "元年"], [1000, "1000"], [1912, "1912"]];
  document.getElementById("axis").innerHTML = TICKS.map(([y, label]) => {
    const left = ((y - min) / total) * 100;
    return '<span style="left:' + left.toFixed(2) + '%">' + label + "</span>";
  }).join("");

  document.getElementById("ribbon").innerHTML = rows.map(r => {
    const w = Math.max((r.span / total) * 100, 1.2);
    return '<a class="seg" href="tang-map/index.html?d=' + r.id + '" title="' + r.name + " " + r.years + '"' +
      ' style="width:' + w.toFixed(3) + '%;background:var(' + VAR[r.era] + ')">' + (w >= 4 ? '<span>' + r.name + '</span>' : '') + '</a>';
  }).join("");

  document.getElementById("legend").innerHTML = ERAS.map((e, i) =>
    '<span><i style="background:var(' + VAR[i] + ')"></i>' + e.name + "</span>").join("");

  document.getElementById("list").innerHTML = ERAS.map((era, i) => {
    const items = rows.filter(r => r.era === i);
    if (!items.length) return "";
    return '<section class="era"><h2>' + era.name + "</h2>" +
      items.map(r =>
        '<a class="row" href="tang-map/index.html?d=' + r.id + '">' +
          '<span class="yr">' + r.years + "</span>" +
          '<span class="nm"><span class="dot" style="background:var(' + VAR[i] + ')"></span>' + r.name + "</span>" +
          '<span class="hk">' + r.hook + "</span>" +
          '<span class="go">进入 →</span>' +
        "</a>").join("") + "</section>";
  }).join("");
})();
</script>
</body>
</html>
